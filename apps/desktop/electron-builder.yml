appId: com.electron.app
productName: 123pan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: 123pan
nsis:
  artifactName: 123pan-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: 123pan-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - pacman
    - flatpak
  executableName: 123pan
  syncDesktopName: true
  maintainer: 123pan <noreply@example.com>
  vendor: 123pan
  category: Utility
  synopsis: 123pan desktop client
  description: Unofficial desktop client for 123pan (123云盘).
deb:
  compression: xz
  artifactName: 123pan-${version}-${arch}.${ext}
pacman:
  compression: zstd
  artifactName: 123pan-${version}-${arch}.pkg.tar.zst
flatpak:
  # 需要系统安装 flatpak、flatpak-builder，以及 org.freedesktop.Sdk /
  # org.electronjs.Electron2.BaseApp 运行时（flatpak install flathub ...）
  runtimeVersion: '24.08'
  baseVersion: '24.08'
  useWaylandFlags: true
appImage:
  artifactName: 123pan-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
